name: Deploy Proxy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: cfat_kmiHzjwW1Y8YDLGU5TBZEgfMLgHfGkIsSkaKSo0C04c6a4f9
          CLOUDFLARE_ACCOUNT_ID: ae285c9173c50923e8e627d0b713b3d7
